name: CD Pipeline - Deploy to Azure Container Apps

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-to-azure:
    name: Build, Push to ACR & Deploy to ACA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure (OIDC / Federated Credentials)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry (ACR)
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build and Push Docker Image to ACR
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ACR_NAME.azurecr.io/secure-rag-cloud:$IMAGE_TAG -t $ACR_NAME.azurecr.io/secure-rag-cloud:latest .
          docker push $ACR_NAME.azurecr.io/secure-rag-cloud:$IMAGE_TAG
          docker push $ACR_NAME.azurecr.io/secure-rag-cloud:latest

      - name: Deploy Revision to Azure Container Apps (ACA)
        run: |
          az containerapp update \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/secure-rag-cloud:${{ github.sha }}

      - name: Health Check & Smoke Test
        run: |
          APP_URL=$(az containerapp show --name ${{ secrets.CONTAINER_APP_NAME }} --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "Verifying deployment at https://$APP_URL/api/v1/health"
          curl --fail --retry 5 --retry-delay 10 --max-time 15 "https://$APP_URL/api/v1/health"
